<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- DNA double helix: two strands crossing -->
  <g fill="none" stroke-linecap="round">
    <!-- Strand 1 (white) -->
    <path d="M 110 90 C 400 170 400 350 110 430" stroke="#ffffff" stroke-width="30"/>
    <!-- Strand 2 (light indigo - second source merging in) -->
    <path d="M 400 90 C 110 170 110 350 400 430" stroke="#c7d2fe" stroke-width="30"/>

    <!-- Base-pair rungs -->
    <g stroke="#ffffff" stroke-width="18" opacity="0.9">
      <line x1="188" y1="117" x2="322" y2="117"/>
      <line x1="217" y1="183" x2="293" y2="183"/>
      <line x1="182" y1="260" x2="328" y2="260"/>
      <line x1="217" y1="340" x2="293" y2="340"/>
      <line x1="188" y1="403" x2="322" y2="403"/>
    </g>
  </g>
</svg>